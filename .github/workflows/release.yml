# Релиз: тег v* -> тесты -> бэкенд (PyInstaller) -> установщик (Tauri, NSIS)
# -> GitHub Release с latest.json, по которому приложение находит обновление.
#
# Нужны секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY           — содержимое %USERPROFILE%\.tauri\booktts.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — пароль к нему
# Без подписи приложение обновление не примет.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Консоль Windows-сборщика — cp1252: кириллица в выводе тестов иначе
      # превращается в UnicodeEncodeError вместо сообщения об ошибке.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "pyinstaller>=6.10"

      - name: Тесты
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Сборка бэкенда
        run: python -m PyInstaller desktop/backend.spec --noconfirm --distpath desktop/backend-dist --workpath build/pyinstaller

      # Запуска мало: 0.3.0 запускалась, но не озвучивала — в сборку не попал
      # numpy. Здесь собранный exe сам проходит путь звука до mp3 и озвучивает
      # фразу через silero.
      - name: Бэкенд озвучивает
        run: |
          desktop/backend-dist/booktts-backend/booktts-backend.exe --version
          desktop/backend-dist/booktts-backend/booktts-backend.exe self-check --synth

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Что изменилось — из audiobook/web/whatsnew/<тег>.md: это же описание покажет
      # окно обновления в установленном приложении.
      - name: Описание релиза
        id: notes
        shell: bash
        run: |
          file="audiobook/web/whatsnew/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<NOTES_EOF'
            if [ -f "$file" ]; then cat "$file"; else echo 'Установщик для Windows. Уже установленное приложение обновится само.'; fi
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          # Бэкенд кладётся в установщик только при релизной сборке: в режиме
          # разработки он запускается из исходников.
          args: --config src-tauri/tauri.release.json
          tagName: ${{ github.ref_name }}
          releaseName: BookTTS ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Страница релиза для людей: что нового, картинка, как установить и
      # зачем каждый файл. Описание в latest.json (его показывает окно
      # обновления в приложении) остаётся коротким — только что нового.
      # Файл .sig не нужен: та же подпись уже лежит внутри latest.json.
      - name: Оформление релиза
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          for asset in $(gh release view "$tag" --json assets --jq '.assets[].name' | grep '\.sig$'); do
            gh release delete-asset "$tag" "$asset" -y
          done
          shots="audiobook/web/whatsnew/${version%.*}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/${shots}"
          {
            echo "**BookTTS ${version}** — многоголосые аудиокниги из ваших книг: каждый персонаж звучит своим голосом."
            echo
            if [ -f "${shots}/home.webp" ]; then echo "![BookTTS ${version}](${raw}/home.webp)"; echo; fi
            cat "audiobook/web/whatsnew/${tag}.md"
            echo
            sed "s/{VERSION}/${version}/g" .github/release-footer.md
          } > release-body.md
          gh release edit "$tag" --notes-file release-body.md
