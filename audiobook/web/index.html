<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookTTS</title>
<script>
// До первой отрисовки, иначе окно мигнёт светлым перед тёмной темой.
try {
  var saved = localStorage.getItem('booktts-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
} catch (e) { /* приватный режим */ }
</script>
<link rel="preload" href="/ui/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/css/tokens.css">
<link rel="stylesheet" href="/ui/css/app.css">
<link rel="stylesheet" href="/ui/css/screens.css">
<link rel="stylesheet" href="/ui/css/pages.css">
<link rel="stylesheet" href="/ui/css/studio.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-side">
      <a class="logo" href="#/" title="Главная">booktts<span>.</span></a>
      <div class="history">
        <button id="nav-back" class="round" aria-label="Назад" title="Назад (Alt+←)"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#arrow-left"></use></svg></button>
        <button id="nav-forward" class="round" aria-label="Вперёд" title="Вперёд (Alt+→)"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#arrow-right"></use></svg></button>
      </div>
    </div>
    <nav class="tabs" id="nav" aria-label="Разделы">
      <div class="tabs-track">
        <span class="tabs-pill" aria-hidden="true"></span>
        <a href="#/" data-route="listen"><span class="fixed-bold" data-text="Главная">Главная</span></a>
        <a href="#/library" data-route="library"><span class="fixed-bold" data-text="Библиотека">Библиотека</span></a>
        <a href="#/studio" data-route="studio"><span class="fixed-bold" data-text="Студия">Студия</span><span class="badge" id="jobs-badge" hidden></span></a>
      </div>
    </nav>
    <div class="topbar-side end">
      <button id="update" class="update-pill" hidden></button>
      <button id="import" class="primary" title="Добавить книгу (Ctrl+O) — или перетащите файл в окно"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#plus"></use></svg>Книга</button>
      <a id="search-link" class="button round" href="#/search" aria-label="Поиск" title="Поиск (Ctrl+K)"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#search"></use></svg></a>
      <button id="theme" class="round"></button>
      <a id="settings-link" class="button round" href="#/settings" aria-label="Настройки" title="Настройки"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#settings"></use></svg></a>
    </div>
  </header>
  <main id="view" class="view"></main>
</div>

<footer id="player" class="player" hidden></footer>
<div id="toasts" aria-live="polite"></div>

<script>
// Ошибки интерфейса — в лог бэкенда: в окне Tauri консоли разработчика не видно.
// Обычный скрипт перед модулями, чтобы поймать и 404, и синтаксическую ошибку модуля.
(function () {
  function report(payload) {
    try {
      fetch('/api/client-log', {
        method: 'POST', keepalive: true, body: JSON.stringify(payload),
        headers: { 'content-type': 'application/json', 'x-requested-with': 'booktts' },
      });
    } catch (e) { /* лог — не повод падать */ }
  }
  window.addEventListener('error', function (event) {
    var target = event.target || {};
    report({
      message: String(event.message || 'не загрузился ресурс'),
      source: event.filename || target.src || target.href || '',
      line: event.lineno || 0,
      stack: (event.error && event.error.stack) || '',
    });
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason || {};
    report({ message: String(reason.message || reason), source: 'promise', line: 0, stack: reason.stack || '' });
  });
})();
</script>
<script type="module" src="/ui/js/app.js"></script>
</body>
</html>
