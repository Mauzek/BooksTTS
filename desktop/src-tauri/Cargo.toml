[package]
name = "booktts"
version = "0.4.0"
description = "BookTTS — многоголосые аудиокниги"
edition = "2021"

[lib]
# Имя с суффиксом _lib: на Windows совпадение имён lib и bin ломает сборку.
name = "booktts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-notification = "2.4"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# Уведомления от имени приложения, а не PowerShell (см. src/notify.rs).
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-registry = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
